version: '3'

services:
  panel-server:
    container_name: air724ug-panel
    build:
      context: ./server-go
      dockerfile: Dockerfile
    image: air724ug-panel:latest
    ports:
      # HTTP 管理面板
      - "9527:9527"
      # MQTT broker（设备接入）
      - "1883:1883"
    volumes:
      # SQLite 数据持久化
      - panel-data:/app/data
    restart: unless-stopped

volumes:
  panel-data:
