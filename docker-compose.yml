version: '3'

services:
  panel-server:
    container_name: air724ug-panel
    build:
      context: ./server-go
      dockerfile: Dockerfile
    image: air724ug-panel:latest
    ports:
      # 单端口：HTTP 管理面板 + MQTT over WebSocket(/websocket) 共用 9527
      - "9527:9527"
    volumes:
      # SQLite 数据持久化
      - panel-data:/app/data
    restart: unless-stopped

volumes:
  panel-data:
